[package]
name = "aven"
version = "0.1.0"
description = "Aven — AI Computer Agent"
authors = ["Aven Team"]
license = "Proprietary"
repository = ""
edition = "2021"

[lib]
name = "aven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.2.0", features = [] }
tauri-plugin-log = "2"
